[project]
name = "mantle-audit-ai"
version = "0.1.0"
description = "AI-powered smart contract audit agent for Mantle ecosystem"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Long Feifei", email = "feiyu169@users.noreply.github.com"},
]

dependencies = [
    "slither-analyzer>=0.10.0",
    "anthropic>=0.40.0",
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "web3>=7.0.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
mantle-audit = "mantle_audit.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
