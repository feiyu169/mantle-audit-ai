[project]
name = "mantle-audit-ai"
version = "0.1.0"
description = "AI-powered smart contract audit agent for Mantle ecosystem"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Long Feifei", email = "feiyu169@users.noreply.github.com"},
]

dependencies = [
    "slither-analyzer>=0.10.0",
    "anthropic>=0.40.0",
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "web3>=7.0.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
mantle-audit = "mantle_audit.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "SIM", "PL", "RUF", "B", "N"]
ignore = [
    "PLR2004",  # magic values OK in assertions
    "E501",     # line-too-long (formatter handles this)
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLR0915",  # too-many-statements
    "SIM212",   # if-expr-with-twisted-arms
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLC0415",  # import-outside-top-level (test fixtures)
    "PLW1510",  # subprocess-run-without-check
    "SIM117",   # multiple-with-statements
    "E402",     # module-import-not-at-top (after pytestmark)
]

# Unicode emoji in CLI/reporter output is intentional
"src/mantle_audit/cli.py" = ["RUF001"]
"src/mantle_audit/reporter.py" = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
